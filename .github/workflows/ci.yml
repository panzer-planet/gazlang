name: CI

on:
  push:
  pull_request:

jobs:
  # The static checks need no build, so they run beside the tests and say so within a couple of
  # minutes; a cold phpstan (CI has no result cache) is what `composer ci` runs locally too
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install the PHP dependencies
        run: composer install --no-interaction --no-progress
      - name: phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: pint
        run: vendor/bin/pint --test

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      # One platform or shard failing shouldn't hide whether the others pass; every one of them
      # must pass for the workflow to
      fail-fast: false
      matrix:
        # Linux on x86_64 and arm64 (gcc, and LeakSanitizer in the sanitized builds), and macOS
        # on Apple silicon and on Intel (where it is developed). macos-15 and ubuntu-24.04-arm,
        # as the release builds on
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
        # Each platform's suite in two halves, split by class timings (tests/.pest/shards.json),
        # each run a process per core; each half builds gaz for itself
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    # A half takes 3 to 11 minutes; a runner GitHub loses contact with otherwise sits silent for 50
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The bootstrap needs nothing but a C compiler: build gaz without TLS, SQLite or libpq
      # and run a program. Then with all three (SQLITE=1 and PG=1 make not finding one an error),
      # and rebuild the compiler with gaz alone, which must give the checked-in bytecode
      - name: Build gaz without TLS or databases
        run: |
          make -C vm TLS=0 SQLITE=0 PG=0
          bin/gaz tests/programs/functions.gaz
          echo 'socket_open("localhost", 1, true);' | bin/gaz 2>&1 | grep -q 'TLS is not built in'
          echo 'db_open("sqlite::memory:");' | bin/gaz 2>&1 | grep -q 'sqlite is not built in'
      - name: Install OpenSSL, SQLite and libpq
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev libsqlite3-dev libpq-dev
      - name: Install libpq
        if: runner.os == 'macOS'
        run: brew install libpq
      - name: Build gaz
        run: make -C vm SQLITE=1 PG=1
      # DbPgTest runs against this server, which the x86_64 Ubuntu runner has installed and the
      # arm64 one may not (the install is a no-op where it is)
      - name: Start PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "create role runner superuser login password 'runner'"
          echo 'GAZLANG_TEST_PG=postgres://runner:runner@localhost/postgres' >> "$GITHUB_ENV"
      - name: Run a program
        run: bin/gaz tests/programs/functions.gaz
      # The sanitized VM (CVMTest, the fuzzer) runs 24 processes at once by default, which the
      # x86 runner takes in its stride and the arm64 one doesn't: measured on ubuntu-24.04-arm,
      # 48 heavy sanitized runs at 24 a time crawl past every time limit while 4 a time, and the
      # fuzzer at 4 jobs, run as fast as on x86. A single sanitized process starts as fast there.
      - name: Fewer sanitized processes at once on arm64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: echo 'GAZLANG_JOBS=4' >> "$GITHUB_ENV"
      - name: Rebuild the compiler with gaz
        run: make -C vm compiler && git diff --exit-code compiler/gazlang.gzb
      # The GazLang tests under gaz's own runner, before PHP is installed: it needs none. On
      # each Linux second half, the lighter one
      - name: gaz test
        if: matrix.shard == 2 && runner.os == 'Linux'
        run: bin/gaz test tests/gaz games

      # PHP runs the tests (PHPUnit classes, by Pest); the language itself needs none.
      # setup-php fails on Apple silicon runners (shivammathur/setup-php#1125), so there
      # Homebrew's own php, which is 8.5, and composer
      - uses: shivammathur/setup-php@v2
        if: runner.os != 'macOS' || runner.arch != 'ARM64'
        with:
          php-version: '8.5'
          coverage: none
          # Utf8CaseTest's oracles for case mapping (Homebrew's php has both)
          extensions: mbstring, intl
      - name: Install PHP and Composer
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          brew install php composer
          php -r 'exit(PHP_VERSION_ID >= 80500 ? 0 : 1);'
      - name: Install the PHP dependencies
        run: composer install --no-interaction --no-progress
      - name: Tests
        run: vendor/bin/pest --parallel --shard=${{ matrix.shard }}/2
      # A minute of fuzzing on a new seed each run, so CI fuzzes a little on every push, on each
      # Linux second half, the lighter one (so on both architectures). A failure may not be this
      # push's: it prints its seed and a shrunk program to replay it with
      - name: Fuzz
        if: matrix.shard == 2 && runner.os == 'Linux'
        run: php tools/fuzz.php --seed ${{ github.run_id }} --seconds 60
