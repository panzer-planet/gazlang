name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing shouldn't hide whether the others pass
      fail-fast: false
      matrix:
        # Linux (gcc, and LeakSanitizer in the sanitized builds), and macOS on Apple silicon
        # and on Intel (where it is developed)
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The bootstrap needs nothing but a C compiler: build gazlang without TLS, SQLite or libpq
      # and run a program. Then with all three (SQLITE=1 and PG=1 make not finding one an error),
      # and rebuild the compiler with gazlang alone, which must give the checked-in bytecode
      - name: Build gazlang without TLS or databases
        run: |
          make -C vm TLS=0 SQLITE=0 PG=0
          bin/gazlang -f tests/programs/functions.gaz
          echo 'socket_open("localhost", 1, true);' | bin/gazlang 2>&1 | grep -q 'TLS is not built in'
          echo 'db_open("sqlite::memory:");' | bin/gazlang 2>&1 | grep -q 'sqlite is not built in'
      - name: Install OpenSSL, SQLite and libpq
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev libsqlite3-dev libpq-dev
      - name: Install libpq
        if: runner.os == 'macOS'
        run: brew install libpq
      - name: Build gazlang
        run: make -C vm SQLITE=1 PG=1
      # DbPgTest runs against this server, which Ubuntu runners have installed
      - name: Start PostgreSQL
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "create role runner superuser login password 'runner'"
          echo 'GAZLANG_TEST_PG=postgres://runner:runner@localhost/postgres' >> "$GITHUB_ENV"
      - name: Run a program
        run: bin/gazlang -f tests/programs/functions.gaz
      - name: Rebuild the compiler with gazlang
        run: make -C vm compiler && git diff --exit-code compiler/gazlang.gzb

      # PHP runs the tests (PHPUnit); the language itself needs none
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install the PHP dependencies
        run: composer install --no-interaction --no-progress
      - name: Tests
        run: vendor/bin/phpunit
      # A minute of fuzzing on a new seed each run, so CI fuzzes a little on every push. A failure
      # may not be this push's: it prints its seed and a shrunk program to replay it with
      - name: Fuzz
        if: runner.os == 'Linux'
        run: php vm/fuzz.php --seed ${{ github.run_id }} --seconds 60
      # The same on every platform, so once is enough
      - name: phpstan
        if: runner.os == 'Linux'
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: pint
        if: runner.os == 'Linux'
        run: vendor/bin/pint --test
